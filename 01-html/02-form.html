<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 02 - Form</title>
    <style>
      fieldset {
        margin: 0;
        border: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <main>
        <h1>Roth IRA Calculator</h1>
        <form action="/submitform">
          <label for="balance">Balance ($)</label>
          <br />
          <input type="text" name="balance" id="balance" />
          <br />
          <br />
          <label for="contribution">Annual contribution (4)</label>
          <br />
          <input type="text" name="contribution" id="contribution" />
          <br />
          <br />
          <fieldset>
            <legend>Maximize contributions?</legend>
            <input type="radio" name="Maximize" id="yes" />
            <label for="yes">Yes</label>
            <input type="radio" name="Maximize" id="no" />
            <label for="no">No</label>
          </fieldset>

          <div>
            <br />
            <label for="rate">Expected rate of return (5)</label>
            <br />
            <input type="number" name="rate" id="rate" />
          </div>

          <div>
            <br />
            <label for="Currage">Current age</label>
            <br />
            <input type="number" name="Currage" id="Currage" />
          </div>

          <div>
            <br />
            <label for="RetireAge">Retirement age</label>
            <br />
            <input type="number" name="RetireAge" id="RetireAge" />
          </div>

          <div>
            <br />
            <label for="tax">Marginal tax rate (%)</label>
            <br />
            <input type="number" name="tax" id="tax" />
          </div>

          <div>
            <br /><input type="submit" value="Calculate" />
            <input type="reset" value="Reset" />
          </div>
        </form>
        <p>
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net/">Calculator.net</a>
        </p>
      </main>
    </main>
  </body>
</html>
